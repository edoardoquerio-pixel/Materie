<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apertura due schede</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f4f4f8;
    }
    .card {
      background: white;
      padding: 2.5rem 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { font-size: 1.4rem; margin: 0 0 0.5rem; color: #222; }
    p  { color: #555; margin: 0; }
    .close { margin-top: 1.2rem; font-size: 0.85rem; color: #999; }
  </style>
</head>
<body>
  <div class="card">
    <h1>✔ Due schede aperte</h1>
    <p>Controlla le nuove finestre del browser.</p>
    <p class="close">Puoi chiudere questa scheda.</p>
  </div>

  <script>
    window.open("", "_blank");
    window.open("", "_blank");
  </script>
</body>
</html>
