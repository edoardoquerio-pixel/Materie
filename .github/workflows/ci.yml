name: CI

on:
  push:
    branches: [main, v1.x.x]
    tags-ignore: ['v*']
  pull_request:
    branches: [main, v1.x.x]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON files
        run: |
          files=$(find . \( -name '.git' -o -name '.vscode' -o -name '.vs' \) -prune -o -name '*.json' -type f -print)
          if [ -z "$files" ]; then
            echo "No JSON files found"
          else
            echo "$files" | while read -r f; do
              echo "Validating: $f"
              python3 -c "import json,sys; json.load(open('$f', encoding='utf-8-sig'))" || exit 1
            done
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check .mjs syntax
        run: |
          files=$(find . \( -name '.git' -o -name '.vscode' -o -name '.vs' \) -prune -o -name '*.mjs' -type f -print)
          if [ -z "$files" ]; then
            echo "No .mjs files found"
          else
            ERRORS=0
            echo "$files" | while read -r f; do
              if ! node --check "$f" 2>/dev/null; then
                echo "FAIL: $f"
                ERRORS=$((ERRORS + 1))
              fi
            done
            echo "Checked $(echo "$files" | wc -l) files"
            [ "$ERRORS" -eq 0 ] || exit 1
          fi

      - name: Check shell scripts
        run: |
          files=$(find . \( -name '.git' -o -name '.vscode' -o -name '.vs' \) -prune -o -name '*.sh' -type f -print)
          if [ -z "$files" ]; then
            echo "No shell scripts found"
          else
            echo "$files" | while read -r f; do
              bash -n "$f" || exit 1
            done
          fi

  # test job rimosso: i test in tests/ appartengono a Zara Agent (overlay separato)
  # e importano moduli non presenti in questo repository.
