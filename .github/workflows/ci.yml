name: CI

on:
  push:
    branches: [main, v1.x.x]
    tags-ignore: ['v*']
  pull_request:
    branches: [main, v1.x.x]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          files=$(find . -name '*.json' -not -path './.git/*' -not -path './.vscode/*' -type f)
          if [ -z "$files" ]; then
            echo "No JSON files found"
          else
            echo "$files" | while read -r f; do
              echo "Validating: $f"
              python3 -m json.tool "$f" || exit 1
            done
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check .mjs syntax
        run: |
          files=$(find . -name '*.mjs' -not -path './.git/*' -type f)
          if [ -z "$files" ]; then
            echo "No .mjs files found"
          else
            ERRORS=0
            echo "$files" | while read -r f; do
              if ! node --check "$f" 2>/dev/null; then
                echo "FAIL: $f"
                ERRORS=$((ERRORS + 1))
              fi
            done
            echo "Checked $(echo "$files" | wc -l) files"
            [ "$ERRORS" -eq 0 ] || exit 1
          fi

      - name: Check shell scripts
        run: |
          files=$(find . -name '*.sh' -not -path './.git/*' -type f)
          if [ -z "$files" ]; then
            echo "No shell scripts found"
          else
            echo "$files" | while read -r f; do
              bash -n "$f" || exit 1
            done
          fi

  test:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Unit tests
        run: |
          files=$(find tests -name '*.test.mjs' -type f 2>/dev/null)
          if [ -z "$files" ]; then
            echo "No test files found"
          else
            echo "$files" | tr '\n' ' ' | xargs node --experimental-sqlite --test --test-concurrency=1
          fi

      - name: Structure tests (bats)
        run: |
          bats_files=$(find tests -name '*.bats' -type f 2>/dev/null)
          if [ -z "$bats_files" ]; then
            echo "No bats test files found"
            exit 0
          fi
          if ! command -v bats &>/dev/null; then
            git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
            sudo /tmp/bats/install.sh /usr/local
          fi
          echo "$bats_files" | tr '\n' ' ' | xargs bats
